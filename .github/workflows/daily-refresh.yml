# Daily refresh: pull new/revised earthquakes from USGS, rebuild the cleaned
# layer, check its quality, and publish it to S3 only if the checks pass
# (write -> audit -> publish). JMA (Japan) goes through the same steps
# separately, so a problem with one source never blocks the other. Then build
# the gold tables and redeploy the dashboard on GitHub Pages.
#
# JMA steps are skipped until its one-time backfill has run (jma-backfill.yml).
#
# Repository settings (Settings > Secrets and variables > Actions):
#   Optional variables S3_BUCKET / AWS_REGION override the defaults in `env` below.
#   Auth, one of:
#     - Variable AWS_ROLE_ARN: an IAM role trusted via GitHub OIDC (preferred, no stored keys)
#     - Secrets AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY: an IAM user limited to
#       s3://<bucket>/data/* (used when the account can't create OIDC providers)

name: Daily refresh

on:
  schedule:
    - cron: "17 21 * * *"  # 21:17 UTC = 06:17 Tokyo, every day
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  id-token: write  # lets the job request an OIDC token for AWS
  contents: read

concurrency:
  group: daily-refresh
  cancel-in-progress: false  # never run two refreshes on the same data at once

env:
  S3_BUCKET: ${{ vars.S3_BUCKET || 'gabe-quake-pipeline' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  S3_DATA: s3://${{ vars.S3_BUCKET || 'gabe-quake-pipeline' }}/data

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pages_ready: ${{ steps.pages.outputs.ready }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pipeline
        run: pip install -e .

      - name: Name this run
        # One id for the whole run, so the dashboard groups both sources' checks together.
        run: echo "QUAKE_RUN_ID=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_ENV"

      # Preferred: OIDC role (no stored keys), used when AWS_ROLE_ARN is set.
      - name: Authenticate to AWS (OIDC role)
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Fallback: access key for an IAM user limited to this bucket's data/ prefix.
      - name: Authenticate to AWS (access key)
        if: vars.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download raw data and state from S3
        # The cleaned layer is rebuilt from raw every run, so it isn't downloaded.
        run: |
          aws s3 sync "$S3_DATA/raw" data/raw --only-show-errors
          aws s3 sync "$S3_DATA/state" data/state --only-show-errors
          aws s3 sync "$S3_DATA/dq" data/dq --only-show-errors  # check history, for the dashboard
          test -f data/state/usgs.json || { echo "No state file in S3 -- run a backfill first"; exit 1; }

      - name: Ingest new and revised events
        run: quake-ingest-usgs --incremental

      - name: Rebuild cleaned layer (write)
        # Built locally first. Athena keeps reading yesterday's S3 copy until
        # this build has passed the quality checks below.
        run: quake-clean

      - name: Upload raw data and state to S3
        # Safe to save before the audit: raw is an exact copy of USGS, and the
        # clean layer is rebuilt from it every run, so a failed build loses nothing.
        run: |
          aws s3 sync data/raw "$S3_DATA/raw" --only-show-errors
          aws s3 sync data/state "$S3_DATA/state" --only-show-errors

      - name: Data quality checks (audit)
        id: dq
        run: quake-dq --dataset usgs

      - name: Publish cleaned layer to S3 (publish)
        # Only reached when every error-level check passed. The layer is
        # replaced wholesale, so --delete removes files that no longer exist.
        run: aws s3 sync data/clean/usgs "$S3_DATA/clean/usgs" --delete --only-show-errors

      # --- JMA (Japan): same write -> audit -> publish, isolated with continue-on-error
      # so the USGS data and the dashboard still update if JMA's site is down.
      - name: Ingest JMA (catalog, daily lists, felt feed)
        id: jma_ingest
        if: hashFiles('data/state/jma.json') != ''
        continue-on-error: true
        run: quake-ingest-jma --catalog --daily --feed

      - name: Upload JMA raw data and state to S3
        if: steps.jma_ingest.outcome != 'skipped'
        run: |
          aws s3 sync data/raw/jma "$S3_DATA/raw/jma" --only-show-errors
          aws s3 sync data/state "$S3_DATA/state" --only-show-errors

      - name: Rebuild JMA clean layer and link it to USGS (write)
        id: jma_clean
        if: steps.jma_ingest.outcome != 'skipped'
        continue-on-error: true
        run: |
          quake-clean-jma
          quake-match

      - name: JMA data quality checks (audit)
        id: jma_dq
        if: steps.jma_clean.outcome == 'success'
        continue-on-error: true
        run: quake-dq --dataset jma

      - name: Publish JMA clean layer to S3 (publish)
        if: steps.jma_dq.outcome == 'success'
        run: |
          for t in jma jma_felt jma_usgs_matches; do
            aws s3 sync "data/clean/$t" "$S3_DATA/clean/$t" --delete --only-show-errors
          done

      - name: Restore last good JMA build
        # A failed JMA build is never published, and the dashboard is built from the
        # last good copy instead.
        if: steps.jma_clean.outcome == 'failure' || steps.jma_dq.outcome == 'failure'
        run: |
          for t in jma jma_felt jma_usgs_matches; do
            rm -rf "data/clean/$t"
            aws s3 sync "$S3_DATA/clean/$t" "data/clean/$t" --only-show-errors
          done

      - name: Build gold layer and dashboard
        # Small summary tables from the published clean layer: Parquet for Athena,
        # JSON for the static dashboard page.
        run: |
          mkdir -p _site
          cp -r site/. _site/
          quake-gold --site-dir _site/data
          aws s3 sync data/gold "$S3_DATA/gold" --delete --only-show-errors

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Mark dashboard ready
        id: pages
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload quality results to S3
        # Passed or failed, keep the record (queryable as quakes.dq_results).
        if: always() && (steps.dq.outcome == 'success' || steps.dq.outcome == 'failure')
        run: |
          aws s3 sync data/dq "$S3_DATA/dq" --only-show-errors
          aws s3 sync data/state "$S3_DATA/state" --only-show-errors

      - name: Summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("data/state/usgs.json"))
          print("### Daily refresh")
          print(f"- New or revised events this run: **{s.get('last_run_events', 0)}**")
          print(f"- Latest USGS update seen: `{s.get('max_updated')}`")
          try:
              j = json.load(open("data/state/jma.json"))
              print(f"- JMA: {j.get('last_run', {})}, daily lists up to `{j.get('daily_done_until')}`")
          except FileNotFoundError:
              print("- JMA: not set up yet (run the JMA backfill workflow)")
          EOF

      - name: Fail the run if JMA had a problem
        # Placed after publishing, so USGS and the dashboard are already updated;
        # failing here still triggers GitHub's failure email and the alert below.
        if: steps.jma_ingest.outcome == 'failure' || steps.jma_clean.outcome == 'failure' || steps.jma_dq.outcome == 'failure'
        env:
          INGEST: ${{ steps.jma_ingest.outcome }}
          CLEAN: ${{ steps.jma_clean.outcome }}
          CHECKS: ${{ steps.jma_dq.outcome }}
        run: |
          echo "JMA ingest: $INGEST, clean: $CLEAN, checks: $CHECKS"
          exit 1

      - name: Alert on failure
        # GitHub already emails the workflow owner when a scheduled run fails.
        # Set secret ALERT_WEBHOOK_URL (a Slack or Discord incoming webhook) to
        # also get a chat message.
        if: failure()
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DQ_OUTCOME: ${{ steps.dq.outcome }}
          JMA_DQ_OUTCOME: ${{ steps.jma_dq.outcome }}
          JMA_INGEST_OUTCOME: ${{ steps.jma_ingest.outcome }}
          JMA_CLEAN_OUTCOME: ${{ steps.jma_clean.outcome }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No ALERT_WEBHOOK_URL set; relying on GitHub's failure email."; exit 0; fi
          if [ "$DQ_OUTCOME" = "failure" ]; then
            reason="data quality checks failed, clean layer NOT published (Athena still serves the last good build)"
          elif [ "$JMA_DQ_OUTCOME" = "failure" ]; then
            reason="JMA data quality checks failed, JMA layer NOT published (USGS and the dashboard still updated)"
          elif [ "$JMA_INGEST_OUTCOME" = "failure" ] || [ "$JMA_CLEAN_OUTCOME" = "failure" ]; then
            reason="the JMA steps errored (USGS and the dashboard still updated)"
          else
            reason="the pipeline errored before publishing"
          fi
          REASON="$reason" python - <<'EOF' > payload.json
          import json, os
          msg = f":rotating_light: quake-pipeline daily refresh failed: {os.environ['REASON']}\n{os.environ['RUN_URL']}"
          print(json.dumps({"text": msg, "content": msg}))  # Slack reads "text", Discord reads "content"
          EOF
          curl -fsS -X POST -H "Content-Type: application/json" --data @payload.json "$WEBHOOK"

  # Publishes the dashboard to GitHub Pages. Only runs once the page has been
  # built from data that passed its checks, so the page never shows a bad build.
  deploy-dashboard:
    needs: refresh
    # Also runs when only the JMA part failed: the page was built from good data either way.
    if: always() && needs.refresh.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
