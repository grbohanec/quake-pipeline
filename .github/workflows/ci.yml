# Lint and test on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Test
        run: pytest -q

  terraform:
    # Formatting and validation only. Plans and applies need AWS admin
    # credentials and are run by hand from infra/ (see README).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: Format
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

  docker:
    # Builds the container image and checks every pipeline command starts in it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t quake-pipeline .

      - name: Smoke test
        run: |
          for cmd in quake-ingest-usgs quake-ingest-jma quake-clean quake-clean-jma \
                     quake-match quake-dq quake-gold; do
            docker run --rm quake-pipeline "$cmd" --help > /dev/null
            echo "ok: $cmd"
          done
          test "$(docker run --rm quake-pipeline whoami)" = pipeline  # not root

      - name: Image size
        run: docker image ls quake-pipeline --format '{{.Size}}' >> "$GITHUB_STEP_SUMMARY"
